<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Result Portal</title>

<!-- jsPDF -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
body{
    font-family: Arial;
    background:#f2f2f2;
    padding:20px;
}
.box{
    background:#fff;
    padding:20px;
    max-width:600px;
    margin:auto;
    border-radius:8px;
}
input,button{
    width:100%;
    padding:10px;
    margin-top:10px;
    font-size:16px;
}
button{
    cursor:pointer;
}
</style>
</head>

<body>

<div class="box">
    <h2 style="text-align:center;">Pre-Board Result</h2>

    <input id="admno" placeholder="Enter Admission Number">
    <button onclick="search()">Search</button>

    <div id="status"></div>

    <button id="pdfBtn" style="display:none;" onclick="generatePDF()">⬇ Download PDF</button>
</div>

<script>
const { jsPDF } = window.jspdf;
let students = [];
let currentStudent = null;

/* Load data */
fetch('data.json')
.then(r=>r.json())
.then(d=>students=d);

/* Search */
function search(){
    let adm = document.getElementById("admno").value.trim();
    let st = students.find(s=> String(s["Adm. No."]).trim()===adm);

    if(!st){
        document.getElementById("status").innerHTML = "❌ Not Found";
        document.getElementById("pdfBtn").style.display="none";
        return;
    }

    currentStudent = st;
    document.getElementById("status").innerHTML = "✅ Result Found";
    document.getElementById("pdfBtn").style.display="block";
}

/* Professional PDF */
function generatePDF(){
    const s = currentStudent;
    const doc = new jsPDF("p","mm","a4");

    let y = 15;

    // Header
    doc.setFont("Times","Bold");
    doc.setFontSize(16);
    doc.text("SACRED HEART SCHOOL",105,y,{align:"center"}); y+=7;

    doc.setFontSize(10);
    doc.text("(Affiliated to CBSE, up to +2 Level, New Delhi, Affiliation No. - 3430224)",105,y,{align:"center"}); y+=6;
    doc.text("Near Sankat Mochan Mandir, Asnabad, Jhumri Telaiya, Koderma",105,y,{align:"center"}); y+=6;
    doc.text("Email: shstelaiya@gmail.com   Website: www.sacredheartkoderma.org",105,y,{align:"center"}); y+=10;

    doc.setFontSize(13);
    doc.text("PRE-BOARD EXAM RESULT (2025 - 26)",105,y,{align:"center"}); y+=12;

    doc.setFontSize(11);
    doc.setFont("Times","Normal");

    doc.text(`STUDENT’S NAME  -  ${s["STUDENT'S NAME"]}`,20,y); y+=7;
    doc.text(`FATHER’S NAME   -  ${s["FATHER'S NAME"]}`,20,y); y+=7;
    doc.text(`Adm. No.        -  ${s["Adm. No."]}`,20,y); y+=7;
    doc.text(`Class           -  ${s["Class"]}`,20,y);
    doc.text(`Sec  -  ${s["Sec."]}`,80,y);
    doc.text(`Roll No.  -  ${s["ROLL No."]}`,130,y); y+=10;

    // Table Header
    doc.setFont("Times","Bold");
    doc.text("SUBJECT",25,y);
    doc.text("FULL MARKS",95,y);
    doc.text("MARKS OBTAINED",150,y);
    y+=3;
    doc.line(20,y,190,y); y+=6;

    doc.setFont("Times","Normal");

    function row(sub,full,marks){
        doc.text(sub,25,y);
        doc.text(full,100,y,{align:"center"});
        doc.text(marks,160,y,{align:"center"});
        y+=7;
    }

    row("ENGLISH","80",s["ENGLISH (TH MAX-80)"]);
    row("HINDI / SANSKRIT","80",s["HINDI(TH MAX-80)"]);
    row("MATHS","80",s["MATHS(TH MAX-80)"]);
    row("SCIENCE","80",s["SCIENCE(TH MAX-80)"]);
    row("SOCIAL SCIENCE","80",s["SOCIAL SCIENCE(TH MAX-80)"]);
    row("INFORMATION TECHNOLOGY","50",s["INFORMATION TECHNOLOGY(TH MAX-50)"]);

    y+=15;

    doc.text("CLASS TEACHER’S SIGN",25,y);
    doc.text("PRINCIPAL",150,y,{align:"center"});
    y+=7;
    doc.text("SACRED HEART SCHOOL",150,y,{align:"center"});

    doc.save(`${s["Adm. No."]}-${s["STUDENT'S NAME"]}.pdf`);
}
</script>

</body>
</html>
