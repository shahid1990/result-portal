<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Result Portal</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
body{
    font-family:'Segoe UI', Arial, sans-serif;
    background:linear-gradient(135deg,#1e3c72,#2a5298);
    min-height:100vh;
    padding:20px;
}
.box{
    background:#fff;
    padding:25px;
    max-width:600px;
    margin:auto;
    border-radius:15px;
    box-shadow:0 20px 40px rgba(0,0,0,0.25);
}
.header{text-align:center;margin-bottom:15px;}
.header img{height:70px;}
h2{text-align:center;color:#1e3c72;}
input{
    width:100%;
    padding:12px;
    font-size:16px;
    border-radius:8px;
    border:1px solid #ccc;
}
button{
    width:100%;
    padding:12px;
    margin-top:12px;
    font-size:16px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-weight:600;
}
.search-btn{background:#1e3c72;color:#fff;}
.generate-btn{background:#2e8b57;color:#fff;}
#status{margin-top:15px;text-align:center;font-weight:600;}
#preview{display:none;margin-top:15px;background:#f4f6fb;padding:12px;border-radius:8px;}
#pdfPreviewContainer{display:none;margin-top:20px;}
iframe{width:100%;height:600px;border:1px solid #ccc;border-radius:8px;}
.footer{
    text-align:center;
    font-size:12px;
    color:#eee;
    margin-top:20px;
}
</style>
</head>

<body>

<div class="box">
    <div class="header">
        <img src="image.jpeg">
        <div>Affiliated to CBSE</div>
    </div>

    <h2>Pre-Board Result (2025-26)</h2>

    <input id="admno" placeholder="Enter Admission Number">
    <button class="search-btn" onclick="search()">Search Result</button>

    <div id="status"></div>
    <div id="preview"></div>

    <button id="generateBtn" class="generate-btn" style="display:none;" onclick="generatePDF()">Generate & Preview PDF</button>

    <div id="pdfPreviewContainer">
        <iframe id="pdfFrame"></iframe>
        <button class="generate-btn" onclick="downloadPDF()">Download PDF</button>
    </div>
</div>

<div class="footer">
© 2025 Sacred Heart School | Result Portal
</div>

<script>
const { jsPDF } = window.jspdf;
let students = [];
let currentStudent = null;

// Load JSON
fetch('data.json')
.then(r=>r.json())
.then(d=>students=d);

// Search
function search(){
    let adm = document.getElementById("admno").value.trim();

    if(!adm){
        status.innerHTML="<span style='color:red;'>Enter Admission Number</span>";
        return;
    }

    let st = students.find(s=>String(s["Adm. No."]).trim()===adm);

    if(!st){
        status.innerHTML="<span style='color:red;'>Not Found</span>";
        preview.style.display="none";
        generateBtn.style.display="none";
        return;
    }

    currentStudent = st;
    status.innerHTML="<span style='color:green;'>Result Found</span>";

    preview.style.display="block";
    preview.innerHTML=`
        <b>Name:</b> ${st["STUDENT'S NAME"]}<br>
        <b>Class:</b> ${st["Class"]}-${st["Sec."]}<br>
        <b>Roll No:</b> ${st["ROLL No."]}
    `;

    generateBtn.style.display="block";
}

// Convert image to base64 safely
function getBase64Image(img) {
    const canvas = document.createElement("canvas");
    canvas.width = img.width;
    canvas.height = img.height;
    const ctx = canvas.getContext("2d");
    ctx.drawImage(img, 0, 0);
    return canvas.toDataURL("image/jpeg");
}

// Create PDF
function createPDF(){

    const s = currentStudent;
    const doc = new jsPDF("p","mm","a4");
    const pageWidth = doc.internal.pageSize.getWidth();
    let y = 15;

    const img = document.querySelector(".header img");
    const base64 = getBase64Image(img);

    // LOGO
    doc.addImage(base64,"JPEG",15,10,25,25);

    // SCHOOL NAME
    doc.setFont("times","bold");
    doc.setFontSize(24);
    doc.text("SACRED HEART SCHOOL", pageWidth/2,18,{align:"center"});

    // BLACK STRIP
    doc.setFillColor(0,0,0);
    doc.rect(45,23,120,8,"F");

    doc.setFontSize(10);
    doc.setTextColor(255,255,255);
    doc.setFont("times","italic");
    doc.text("(Affiliated to CBSE, up to +2 Level, New Delhi, Affiliation No. - 3430224)",
        pageWidth/2,29,{align:"center"});

    doc.setTextColor(0,0,0);

    doc.setFontSize(11);
    doc.setFont("times","normal");
    doc.text("Near Sankat Mochan Mandir, Asnabad, Jhumri Telaiya, Koderma",
        pageWidth/2,37,{align:"center"});
    doc.text("Email: shstelaiya@gmail.com     Website: www.sacredheartkoderma.org",
        pageWidth/2,43,{align:"center"});

    doc.setLineWidth(0.8);
    doc.line(15,48,pageWidth-15,48);

    y = 60;

    doc.setFont("times","bold");
    doc.setFontSize(14);
    doc.text("PRE-BOARD EXAM RESULT (2025-26)",pageWidth/2,y,{align:"center"});
    y+=12;

    doc.setFont("times","normal");
    doc.setFontSize(11);

    doc.text(`Student Name : ${s["STUDENT'S NAME"]}`,20,y); y+=7;
    doc.text(`Father's Name : ${s["FATHER'S NAME"]}`,20,y); y+=7;
    doc.text(`Admission No : ${s["Adm. No."]}`,20,y); y+=7;
    doc.text(`Class : ${s["Class"]}-${s["Sec."]}`,20,y);
    doc.text(`Roll No : ${s["ROLL No."]}`,120,y); y+=10;

    doc.setFont("times","bold");
    doc.text("SUBJECT",25,y);
    doc.text("FULL",100,y,{align:"center"});
    doc.text("MARKS",160,y,{align:"center"});
    y+=3;
    doc.line(20,y,190,y);
    y+=6;

    doc.setFont("times","normal");

    function row(sub,full,marks){
        doc.text(sub,25,y);
        doc.text(String(full),100,y,{align:"center"});
        doc.text(String(marks),160,y,{align:"center"});
        y+=7;
    }

    row("ENGLISH",80,s["ENGLISH (TH MAX-80)"]);
    row("HINDI",80,s["HINDI(TH MAX-80)"]);
    row("MATHS",80,s["MATHS(TH MAX-80)"]);
    row("SCIENCE",80,s["SCIENCE(TH MAX-80)"]);
    row("SOCIAL SCIENCE",80,s["SOCIAL SCIENCE(TH MAX-80)"]);
    row("INFORMATION TECHNOLOGY",50,s["INFORMATION TECHNOLOGY(TH MAX-50)"]);

    y+=20;
    doc.text("Class Teacher's Sign",25,y);
    doc.text("Principal",160,y,{align:"center"});

    return doc;
}

// Preview
function generatePDF(){
    const doc = createPDF();
    const blob = doc.output("blob");
    const url = URL.createObjectURL(blob);
    pdfFrame.src = url;
    pdfPreviewContainer.style.display="block";
}

// Download
function downloadPDF(){
    const doc = createPDF();
    doc.save(`${currentStudent["Adm. No."]}-${currentStudent["STUDENT'S NAME"]}.pdf`);
}
</script>

</body>
</html>
